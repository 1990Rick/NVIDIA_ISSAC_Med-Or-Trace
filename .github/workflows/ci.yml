name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.4"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,usd]"
      - name: Core, training and analysis tests
        run: pytest -q tests
      - name: ROS 2 package tests (pure python, no rclpy needed)
        run: pytest -q ros2_ws/src/medortrace_ros/test
      - name: Offline Isaac adapter checks (no Isaac Sim needed)
        run: python scripts/isaac/check_offline.py
