# QoS profiles of the MED-OR-TRACE ROS 2 graph (loaded by medortrace_ros/qos.py).
# Topic -> profile assignment lives in medortrace_ros/topics.py (TopicSpec.qos); per-topic overrides below.
#
# Rationale (docs/ros2_message_graph.md, "QoS rationale"):
#   * sensor data is BEST_EFFORT / VOLATILE with a shallow queue: a late scan is worse than a lost scan,
#     the assembler only ever uses the newest message, and best-effort subscribers accept both
#     best-effort and reliable driver publishers;
#   * verdicts and provenance are RELIABLE / TRANSIENT_LOCAL with a deep history: they are the audit
#     record and must not be dropped.  A late joiner (OR dashboard, audit logger) receives the newest `depth`
#     events.  Provenance runs at ~17 events/s nominal (up to ~40/s), so its depth (20000) holds a complete
#     default case (180 s: ~3000 events) with margin, ~20 min at the nominal rate.  Longer cases leave late
#     joiners a suffix, verified with records.verify_provenance_stream(anchor=... | allow_suffix=True); the
#     complete chain is the autonomy node's audit export (audit_dir) or a recording started with the mission.
#     Bounded KEEP_LAST rather than KEEP_ALL keeps publisher memory bounded (~0.5 kB/event) and never blocks
#     the control loop on DDS resource limits;
#   * mission and current state (safety state, beliefs, maps) are RELIABLE / TRANSIENT_LOCAL depth 1:
#     a late joiner immediately gets the latest value (latched-topic semantics);
#   * commands are RELIABLE / VOLATILE depth 1: compatible with both reliable and best-effort subscribers
#     (e.g. the Isaac Sim OmniGraph twist subscriber) and never replayed to a late joiner.
profiles:
  clock:          {reliability: reliable,    durability: volatile,        history: keep_last, depth: 1}
  tf:             {reliability: reliable,    durability: volatile,        history: keep_last, depth: 100}
  sensor_data:    {reliability: best_effort, durability: volatile,        history: keep_last, depth: 5}
  sensor_dense:   {reliability: best_effort, durability: volatile,        history: keep_last, depth: 2}
  command:        {reliability: reliable,    durability: volatile,        history: keep_last, depth: 1}
  events:         {reliability: reliable,    durability: transient_local, history: keep_last, depth: 500}
  latched:        {reliability: reliable,    durability: transient_local, history: keep_last, depth: 1}
  state:          {reliability: reliable,    durability: transient_local, history: keep_last, depth: 1}
  state_volatile: {reliability: reliable,    durability: volatile,        history: keep_last, depth: 5}
  audit:          {reliability: reliable,    durability: transient_local, history: keep_last, depth: 2000}

# Per-topic overrides (keys of medortrace_ros.topics.TOPICS), merged over the profile.
overrides:
  imu: {depth: 50}                 # 10 samples per 0.1 s control tick must survive one missed spin
  workflow: {depth: 1000}          # full case record for a late-joining autonomy node
  provenance: {depth: 20000}       # ~17 (up to ~40) events/s x case length; see the rationale above
